<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>全局记忆</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#242a35; --text:#e8ecf3;
    --muted:#8b95a7; --accent:#6ea8fe; --ok:#3fb950; --warn:#d29922;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --line:#e3e6ec; --text:#1a1d23;
           --muted:#6b7280; --accent:#2563eb; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
            "Microsoft YaHei",sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:20px}
  header{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  h1{font-size:19px;margin:0;font-weight:650}
  .sub{color:var(--muted);font-size:12.5px}
  .bar{display:flex;gap:8px;margin-bottom:14px}
  input[type=search]{flex:1;padding:9px 12px;border-radius:9px;
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    font-size:14px;outline:none}
  input[type=search]:focus{border-color:var(--accent)}
  button{padding:9px 15px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);cursor:pointer;font-size:13.5px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#fff;border-color:transparent}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:9px;
        padding:7px 13px;font-size:12.5px;color:var(--muted)}
  .chip b{color:var(--text);font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;
        padding:13px 15px;margin-bottom:9px}
  .card-head{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .kind{font-size:11px;padding:1.5px 7px;border-radius:5px;
        background:rgba(110,168,254,.14);color:var(--accent);font-weight:600}
  .title{font-weight:600;font-size:13.5px;flex:1;min-width:0;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{color:var(--muted);font-size:11.5px;white-space:nowrap}
  .body{color:var(--muted);font-size:13px;white-space:pre-wrap;
        max-height:132px;overflow:hidden;position:relative}
  .body.open{max-height:none}
  .more{color:var(--accent);font-size:12px;cursor:pointer;margin-top:5px;
        display:inline-block}
  .del{color:var(--muted);font-size:11.5px;cursor:pointer;margin-left:8px}
  .del:hover{color:#f85149}
  .empty{text-align:center;color:var(--muted);padding:44px 0;font-size:13.5px}
  .foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>全局记忆</h1>
    <span class="sub" id="conn">连接中…</span>
  </header>

  <div class="stats" id="stats"></div>

  <div class="bar">
    <input type="search" id="q" placeholder="搜点什么：财务 / 纳米银 / 答辩 …（2 个字也能命中）" />
    <button class="primary" id="search">搜索</button>
    <button id="reload">刷新</button>
  </div>

  <div id="list"></div>
  <div class="foot">文件正文、工具调用记录都在这里。只读浏览；删除不可恢复。</div>
</div>

<script type="module">
const PLUGIN_ID = "astrbot_plugin_global_memory";
const bridge = window.AstrBotPluginView || window.AstrBotPluginPage;

const el = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function apiGet(ep, params) {
  const query = params ? "?" + new URLSearchParams(params).toString() : "";
  const payload = await bridge.apiGet(`${PLUGIN_ID}/${ep}${query}`);
  if (payload && payload.ok === false) throw new Error(payload.error || "请求失败");
  return payload && Object.prototype.hasOwnProperty.call(payload, "data")
    ? payload.data : payload;
}

async function apiPost(ep, body) {
  const payload = await bridge.apiPost(`${PLUGIN_ID}/${ep}`, body);
  if (payload && payload.ok === false) throw new Error(payload.error || "操作失败");
  return payload || {};
}

function renderStats(s) {
  const kinds = Object.entries(s.by_kind || {})
    .map(([k, v]) => `${k} ${v}`).join(" · ") || "空";
  el("stats").innerHTML =
    `<span class="chip">总计 <b>${s.total ?? 0}</b></span>` +
    `<span class="chip">分类 <b>${esc(kinds)}</b></span>`;
}

function renderList(data) {
  const items = data.items || [];
  if (!items.length) {
    el("list").innerHTML = `<div class="empty">没有找到记忆</div>`;
    return;
  }
  el("list").innerHTML = items.map((it) => {
    const body = esc(it.content || "");
    const long = (it.content || "").length > 260;
    return `<div class="card" data-id="${it.id}">
      <div class="card-head">
        <span class="kind">${esc(it.kind || "?")}</span>
        <span class="title">${esc(it.title || "(无标题)")}</span>
        <span class="meta">${esc(it.created_at || "")}</span>
      </div>
      <div class="body">${body}</div>
      ${long ? `<span class="more">展开</span>` : ""}
      <span class="del" data-del="${it.id}">删除</span>
    </div>`;
  }).join("");

  el("list").querySelectorAll(".more").forEach((node) => {
    node.onclick = () => {
      const b = node.parentElement.querySelector(".body");
      b.classList.toggle("open");
      node.textContent = b.classList.contains("open") ? "收起" : "展开";
    };
  });
  el("list").querySelectorAll("[data-del]").forEach((node) => {
    node.onclick = async () => {
      const id = node.getAttribute("data-del");
      if (!confirm(`删除记忆 #${id}？不可恢复。`)) return;
      try {
        await apiPost("delete", { id: Number(id) });
        node.closest(".card").remove();
      } catch (e) { alert("删除失败：" + e.message); }
    };
  });
}

async function load(q) {
  try {
    el("conn").textContent = "已连接";
    const [stats, list] = await Promise.all([
      apiGet("stats"),
      apiGet("memories", q ? { q, limit: 100 } : { limit: 100 }),
    ]);
    renderStats(stats);
    renderList(list);
  } catch (e) {
    el("conn").textContent = "连接失败";
    el("list").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

async function boot() {
  if (!bridge) {
    el("conn").textContent = "bridge 未加载";
    return;
  }
  await bridge.ready();
  await load("");
  el("search").onclick = () => load(el("q").value.trim());
  el("reload").onclick = () => { el("q").value = ""; load(""); };
  el("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter") load(el("q").value.trim());
  });
}
boot();
</script>
</body>
</html>
